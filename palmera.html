<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Palmera SVG realista</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(#fde9b8 0%, #f7c873 55%, #e8a35a 100%);
    }
  </style>
</head>
<body>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="420" height="500">

    <defs>
      <!-- Degradado del tronco -->
      <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#6b4a2b"/>
        <stop offset="45%" stop-color="#9c6b3d"/>
        <stop offset="100%" stop-color="#5a3c22"/>
      </linearGradient>

      <!-- Degradados de las hojas -->
      <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#2f7d32"/>
        <stop offset="100%" stop-color="#1c5021"/>
      </linearGradient>
      <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#5cb85c"/>
        <stop offset="100%" stop-color="#3a8c3e"/>
      </linearGradient>

      <radialGradient id="coco" cx="35%" cy="35%" r="70%">
        <stop offset="0%"  stop-color="#7a4f2c"/>
        <stop offset="100%" stop-color="#3f2814"/>
      </radialGradient>

      <!-- Plantilla de una hoja con foliolos -->
      <g id="frond">
        <path d="M0 0 Q70 -8 150 6 Q70 14 0 0 Z" fill="url(#leafDark)"/>
        <g stroke="#1c5021" stroke-width="2" stroke-linecap="round">
          <line x1="20"  y1="2"  x2="30"  y2="-12"/>
          <line x1="40"  y1="3"  x2="52"  y2="-13"/>
          <line x1="62"  y1="4"  x2="74"  y2="-13"/>
          <line x1="84"  y1="5"  x2="96"  y2="-11"/>
          <line x1="106" y1="6"  x2="116" y2="-8"/>
          <line x1="20"  y1="3"  x2="30"  y2="16"/>
          <line x1="40"  y1="4"  x2="52"  y2="17"/>
          <line x1="62"  y1="5"  x2="74"  y2="17"/>
          <line x1="84"  y1="6"  x2="96"  y2="15"/>
          <line x1="106" y1="6"  x2="116" y2="11"/>
        </g>
        <path d="M0 0 Q75 0 150 6" stroke="#143a18" stroke-width="2.5" fill="none"/>
      </g>
    </defs>

    <!-- Suelo / arena -->
    <ellipse cx="150" cy="338" rx="120" ry="20" fill="#d99a4e" opacity="0.55"/>

    <!-- Tronco curvado y segmentado -->
    <path d="M140 330
             C 132 260, 150 200, 148 150
             C 147 120, 156 100, 162 92
             L 178 96
             C 172 108, 166 128, 168 152
             C 172 205, 160 265, 168 330 Z"
          fill="url(#trunk)"/>
    <g stroke="#3f2a17" stroke-width="2" opacity="0.5" fill="none">
      <path d="M141 312 Q154 309 166 314"/>
      <path d="M140 286 Q153 283 165 289"/>
      <path d="M141 258 Q153 255 166 262"/>
      <path d="M144 228 Q156 226 168 233"/>
      <path d="M147 198 Q158 196 169 203"/>
      <path d="M150 168 Q160 166 170 173"/>
    </g>

    <!-- Cocos -->
    <circle cx="160" cy="104" r="10" fill="url(#coco)"/>
    <circle cx="176" cy="110" r="10" fill="url(#coco)"/>
    <circle cx="168" cy="120" r="10" fill="url(#coco)"/>

    <!-- Corona de hojas -->
    <g transform="translate(170 100)">
      <use href="#frond" transform="rotate(-12) scale(1.05)"/>
      <use href="#frond" transform="rotate(28)"/>
      <use href="#frond" transform="rotate(64)"/>
      <use href="#frond" transform="rotate(150) scale(1.05)"/>
      <use href="#frond" transform="rotate(192)"/>
      <use href="#frond" transform="rotate(225)"/>
      <use href="#frond" transform="scale(-1 1) rotate(28)"/>
      <use href="#frond" transform="rotate(-46) scale(0.95)" fill="url(#leafLight)"/>
      <use href="#frond" transform="rotate(110) scale(0.95)"/>
    </g>

  </svg>

</body>
</html>
